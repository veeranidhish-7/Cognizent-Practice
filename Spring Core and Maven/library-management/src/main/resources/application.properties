spring.application.name=library-management

# Exercise 9: H2 in-memory database configuration
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Exercise 9: let Hibernate create/update the schema from the Book entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Optional: browse the database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:librarydb, user: sa, blank password)
spring.h2.console.enabled=true

server.port=8080
